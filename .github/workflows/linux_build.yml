name: Linux VST3 Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SDL3_VERSION: "3.4.2"
  SDL3_TTF_VERSION: "3.2.2"
  SDL3_IMAGE_VERSION: "3.4.0"

jobs:

  # -------------------------------------------------------------------
  # Job 1: Build SDL3 once, cache it. 
  # -------------------------------------------------------------------
  build-sdl3:
    runs-on: ubuntu-22.04
    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config \
             libharfbuzz-dev libpng-dev libjpeg-dev libfreetype6-dev \
             libx11-dev libxcursor-dev libxext-dev libxinerama-dev \
             libxrandr-dev libxi-dev libxss-dev libxxf86vm-dev \
             libxtst-dev \
             libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev \
             libasound2-dev libpulse-dev

    - name: Restore SDL3 cache
      id: cache-sdl3
      uses: actions/cache/restore@v4
      with:
        path: sdl3-install
        key: sdl3-ubuntu22-${{ env.SDL3_VERSION }}

    - name: Build SDL3 from source
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch release-${{ env.SDL3_VERSION }} \
          https://github.com/libsdl-org/SDL.git sdl3-src
        cmake -S sdl3-src -B sdl3-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl3-install \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF
        cmake --build sdl3-build -j$(nproc)
        cmake --install sdl3-build

    - name: Build SDL3_ttf from source
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch release-${{ env.SDL3_TTF_VERSION }} \
          https://github.com/libsdl-org/SDL_ttf.git sdl3_ttf-src
        cmake -S sdl3_ttf-src -B sdl3_ttf-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl3-install \
              -DSDLTTF_SHARED=ON -DSDLTTF_STATIC=OFF \
              -DSDLTTF_VENDORED=OFF
        cmake --build sdl3_ttf-build -j$(nproc)
        cmake --install sdl3_ttf-build

    - name: Build SDL3_image from source
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch release-${{ env.SDL3_IMAGE_VERSION }} \
          https://github.com/libsdl-org/SDL_image.git sdl3_image-src
        cmake -S sdl3_image-src -B sdl3_image-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl3-install \
              -DSDLIMAGE_SHARED=ON -DSDLIMAGE_STATIC=OFF \
              -DSDLIMAGE_VENDORED=OFF
        cmake --build sdl3_image-build -j$(nproc)
        cmake --install sdl3_image-build

    - name: Save SDL3 cache
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: sdl3-install
        key: sdl3-ubuntu22-${{ env.SDL3_VERSION }}

    - name: Verify SDL3 pkg-config
      run: |
        export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/sdl3-install/lib/pkgconfig
        pkg-config --modversion sdl3 sdl3-ttf sdl3-image

  # -------------------------------------------------------------------
  # Job 2: Generic build. Depends on SDL3 job.
  # -------------------------------------------------------------------
  build-generic:
    runs-on: ubuntu-22.04
    needs: build-sdl3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build cmake patchelf \
             qt6-base-dev-tools qt6-base-dev \
             libasound2-dev libx11-dev libxinerama-dev libxext-dev \
             libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
             libxrandr-dev libxcursor-dev curl libcurl4-openssl-dev \
             libfontconfig1-dev python3 pkg-config \
             libharfbuzz-dev libpng-dev libjpeg-dev libpulse-dev libsdl2-dev \
             qtbase5-dev qt5-qmake qtbase5-dev-tools zlib1g-dev

    - name: Provide a qmake6 stub (MAME probes Qt headers even with USE_QTDEBUG=0)
      run: |
        # scripts/src/osd/sdl_cfg.lua ALWAYS adds this to every SDL OSD project on
        # Linux, regardless of USE_QTDEBUG:
        #     -I$(shell qmake6 -query QT_INSTALL_HEADERS)
        # It is evaluated at COMPILE time for every object. With qmake6 absent the
        # shell call returns an EMPTY string, leaving a bare "-I" on the command
        # line, and a bare -I swallows the NEXT argument, which is -std=c++20.
        # Losing C++20 is what produced the bogus "char8_t was not declared"
        # errors in the stock language.h.
        #
        # We do not build the Qt debugger, so the probe only has to return a valid
        # path. A tiny stub pointing at an empty directory is enough, and avoids
        # depending on any Qt package being installed.
        sudo mkdir -p /usr/local/share/qmake6-stub/include
        echo '#!/bin/sh' | sudo tee /usr/local/bin/qmake6 > /dev/null
        echo 'echo /usr/local/share/qmake6-stub/include' | sudo tee -a /usr/local/bin/qmake6 > /dev/null
        sudo chmod +x /usr/local/bin/qmake6
        echo "qmake6 -> $(which qmake6)"
        echo "QT_INSTALL_HEADERS -> $(qmake6 -query QT_INSTALL_HEADERS)"


    - name: Restore SDL3 cache
      uses: actions/cache/restore@v4
      with:
        path: sdl3-install
        key: sdl3-ubuntu22-${{ env.SDL3_VERSION }}

    - name: Export SDL3 paths
      run: |
        SDL3_PREFIX=$GITHUB_WORKSPACE/sdl3-install
        echo "SDL3_PREFIX=$SDL3_PREFIX" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$SDL3_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$SDL3_PREFIX/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Restore MAME cache
      id: cache-mame
      uses: actions/cache/restore@v4
      with:
        path: mame
        key: mame-0288-pic-Generic-${{ hashFiles('Mame_Patches/**') }}

    - name: Clone MAME v0.288 (only if not cached)
      if: steps.cache-mame.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch mame0288 \
          https://github.com/mamedev/mame.git mame

    - name: Clone JUCE 8.0.15
      run: |
        git clone --depth 1 --branch 8.0.15 \
          https://github.com/juce-framework/JUCE.git juce

    - name: Apply MAME patches (always — make detects changed files via timestamp)
      run: |
        # Only overwrite when the content actually differs, so that on a cache
        # hit make has nothing to rebuild.
        copy_if_changed() {
          if [ ! -f "$2" ] || ! cmp -s "$1" "$2"; then
            cp "$1" "$2"
            echo "  updated: $2"
          fi
        }
        copy_if_changed Mame_Patches/esqpanel.h mame/src/mame/ensoniq/esqpanel.h
        copy_if_changed Mame_Patches/esqpanel.cpp mame/src/mame/ensoniq/esqpanel.cpp
        copy_if_changed Mame_Patches/esq5505.cpp mame/src/mame/ensoniq/esq5505.cpp
        copy_if_changed Mame_Patches/sd132.lay mame/src/mame/layout/sd132.lay
        copy_if_changed Mame_Patches/esq16_dsk.cpp mame/src/lib/formats/esq16_dsk.cpp
        copy_if_changed Mame_Patches/es5510.cpp mame/src/devices/cpu/es5510/es5510.cpp
        copy_if_changed Mame_Patches/main.h mame/src/emu/main.h
        copy_if_changed Mame_Patches/emufwd.h mame/src/emu/emufwd.h
        copy_if_changed Mame_Patches/machine.h mame/src/emu/machine.h
        copy_if_changed Mame_Patches/video.cpp mame/src/emu/video.cpp
        copy_if_changed Mame_Patches/emu.h mame/src/emu/emu.h
        copy_if_changed Mame_Patches/sound.cpp mame/src/emu/sound.cpp
        copy_if_changed Mame_Patches/machine.cpp mame/src/emu/machine.cpp
        copy_if_changed Mame_Patches/rendlay.cpp mame/src/emu/rendlay.cpp
        copy_if_changed Mame_Patches/debugcpu.cpp mame/src/emu/debug/debugcpu.cpp
        copy_if_changed Mame_Patches/cheat.cpp mame/src/frontend/mame/cheat.cpp
        copy_if_changed Mame_Patches/clifront.cpp mame/src/frontend/mame/clifront.cpp
        copy_if_changed Mame_Patches/luaengine.cpp mame/src/frontend/mame/luaengine.cpp
        copy_if_changed Mame_Patches/luaengine.h mame/src/frontend/mame/luaengine.h
        copy_if_changed Mame_Patches/luaengine_render.cpp mame/src/frontend/mame/luaengine_render.cpp
        copy_if_changed Mame_Patches/mame.cpp mame/src/frontend/mame/mame.cpp
        copy_if_changed Mame_Patches/mame.h mame/src/frontend/mame/mame.h
        copy_if_changed Mame_Patches/ui.cpp mame/src/frontend/mame/ui/ui.cpp
        copy_if_changed Mame_Patches/pluginopt.cpp mame/src/frontend/mame/ui/pluginopt.cpp
        copy_if_changed Mame_Patches/selgame.cpp mame/src/frontend/mame/ui/selgame.cpp
        copy_if_changed Mame_Patches/mainmenu.cpp mame/src/frontend/mame/ui/mainmenu.cpp
        copy_if_changed Mame_Patches/utils.cpp mame/src/frontend/mame/ui/utils.cpp
        copy_if_changed Mame_Patches/datmenu.cpp mame/src/frontend/mame/ui/datmenu.cpp
        copy_if_changed Mame_Patches/devopt.cpp mame/src/frontend/mame/ui/devopt.cpp
        copy_if_changed Mame_Patches/viewgfx.cpp mame/src/frontend/mame/ui/viewgfx.cpp
        copy_if_changed Mame_Patches/cheatopt.cpp mame/src/frontend/mame/ui/cheatopt.cpp
        copy_if_changed Mame_Patches/selmenu.cpp mame/src/frontend/mame/ui/selmenu.cpp
        copy_if_changed Mame_Patches/selsoft.cpp mame/src/frontend/mame/ui/selsoft.cpp
        copy_if_changed Mame_Patches/miscmenu.cpp mame/src/frontend/mame/ui/miscmenu.cpp
        copy_if_changed Mame_Patches/info.cpp mame/src/frontend/mame/ui/info.cpp
        copy_if_changed Mame_Patches/simpleselgame.cpp mame/src/frontend/mame/ui/simpleselgame.cpp
        copy_if_changed Mame_Patches/main.cpp mame/src/zexall/main.cpp

    - name: Compile MAME sd132 (Generic) — incremental, picks up changed files
      run: |
        cd mame
        # MAME quirk (scripts/src/osd/sdl_cfg.lua): on Linux it ALWAYS adds
        #   -I$(shell qmake6 -query QT_INSTALL_HEADERS)
        # to every SDL OSD project, regardless of USE_QTDEBUG. That $(shell ...)
        # runs at COMPILE time for every object, so a missing qmake6 floods the
        # log with "qmake6: No such file or directory" and leaves osd_sdl3 without
        # its proper flags (hence the bogus char8_t/C++20 errors in language.h).
        # A qmake6 stub is installed in an earlier step so this probe returns a
        # valid path instead of an empty one (see that step for the reason).
        rm -rf build/projects
        make SUBTARGET=sd132 SOURCES=src/mame/ensoniq/esq5505.cpp \
             OSD=sdl3 USE_QTDEBUG=0 REGENIE=1 NO_USE_BGFX=1 \
             ARCHOPTS=-fPIC -j$(nproc)

    - name: Save MAME cache
      if: steps.cache-mame.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: mame
        key: mame-0288-pic-Generic-${{ hashFiles('Mame_Patches/**') }}

    - name: Build Projucer
      run: |
        cd juce/extras/Projucer/Builds/LinuxMakefile
        make CONFIG=Release -j$(nproc)

    - name: Patch .jucer for CI
      run: |
        sed -i 's/useGlobalPath="1"/useGlobalPath="0"/g' EnsoniqSD1-LINUX.jucer
        sed -i 's|<MODULEPATH id="\([^"]*\)" path="[^"]*"/>|<MODULEPATH id="\1" path="juce/modules"/>|g' EnsoniqSD1-LINUX.jucer
        sed -i 's/pluginFormats="[^"]*"/pluginFormats="buildVST3"/' EnsoniqSD1-LINUX.jucer
        sed -i 's/sd1disk"/sd1disk\&#10;GL\&#10;asound\&#10;pulse\&#10;SDL3_ttf\&#10;ocore_sdl3"/' EnsoniqSD1-LINUX.jucer

    - name: Regenerate JuceLibraryCode via Projucer
      run: |
        # Remove the committed exporter Makefile first: Projucer does not always
        # rewrite it, and the stale copy still links the MAME 0.287-era
        # "-lsoftfloat" library, which no longer exists in 0.288 (only softfloat3).
        rm -f Builds/LinuxMakefile/Makefile
        juce/extras/Projucer/Builds/LinuxMakefile/build/Projucer \
          --resave EnsoniqSD1-LINUX.jucer
        ls -l JuceLibraryCode/
        # Belt and braces: if anything still emits the obsolete -lsoftfloat, strip
        # it here. The trailing space keeps -lsoftfloat3 intact.
        sed -i 's/-lsoftfloat //g' Builds/LinuxMakefile/Makefile
        echo "--- link libs after fixup ---"
        grep -o -- "-lsoftfloat[0-9]*" Builds/LinuxMakefile/Makefile | sort -u

    - name: Compile JUCE VST3 (Generic)
      run: |
        cd Builds/LinuxMakefile
        export CXXFLAGS="-I${{ env.SDL3_PREFIX }}/include"
        export LDFLAGS="-L${{ env.SDL3_PREFIX }}/lib -Wl,-rpath,${{ env.SDL3_PREFIX }}/lib -lz -lX11 -lXext"
        make CONFIG=Release -j$(nproc)

    - name: Inject Lua and SDL3 into VST3 Bundle (Generic)
      run: |
        # Put Resources folder into VST3 bundle
        mkdir -p Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/Resources
        cp -R mame/plugins Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/Resources/
        
        # copy SDL3 and SDL3_ttf into VST3
        cp -P ${{ env.SDL3_PREFIX }}/lib/libSDL3*.so* Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/x86_64-linux/
        
        # RPATH (Run-time search path) rewrite with patchelf
        patchelf --set-rpath '$ORIGIN' Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/x86_64-linux/EnsoniqSD1.so
        
        # Check
        ls -la Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/x86_64-linux/

    - name: Upload VST3 artifact (Generic)
      uses: actions/upload-artifact@v4
      with:
        name: Ensoniq_SD1_Linux_VST3_Generic
        path: Builds/LinuxMakefile/build/*.vst3

  # -------------------------------------------------------------------
  # Job 3: AVX2 build. Only runs if Generic succeeded.
  # -------------------------------------------------------------------
  build-avx2:
    runs-on: ubuntu-22.04
    needs: build-generic

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build cmake patchelf \
             qt6-base-dev-tools qt6-base-dev \
             libasound2-dev libx11-dev libxinerama-dev libxext-dev \
             libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
             libxrandr-dev libxcursor-dev curl libcurl4-openssl-dev \
             libfontconfig1-dev python3 pkg-config \
             libharfbuzz-dev libpng-dev libjpeg-dev libpulse-dev libsdl2-dev \
             qtbase5-dev qt5-qmake qtbase5-dev-tools zlib1g-dev

    - name: Provide a qmake6 stub (MAME probes Qt headers even with USE_QTDEBUG=0)
      run: |
        # scripts/src/osd/sdl_cfg.lua ALWAYS adds this to every SDL OSD project on
        # Linux, regardless of USE_QTDEBUG:
        #     -I$(shell qmake6 -query QT_INSTALL_HEADERS)
        # It is evaluated at COMPILE time for every object. With qmake6 absent the
        # shell call returns an EMPTY string, leaving a bare "-I" on the command
        # line, and a bare -I swallows the NEXT argument, which is -std=c++20.
        # Losing C++20 is what produced the bogus "char8_t was not declared"
        # errors in the stock language.h.
        #
        # We do not build the Qt debugger, so the probe only has to return a valid
        # path. A tiny stub pointing at an empty directory is enough, and avoids
        # depending on any Qt package being installed.
        sudo mkdir -p /usr/local/share/qmake6-stub/include
        echo '#!/bin/sh' | sudo tee /usr/local/bin/qmake6 > /dev/null
        echo 'echo /usr/local/share/qmake6-stub/include' | sudo tee -a /usr/local/bin/qmake6 > /dev/null
        sudo chmod +x /usr/local/bin/qmake6
        echo "qmake6 -> $(which qmake6)"
        echo "QT_INSTALL_HEADERS -> $(qmake6 -query QT_INSTALL_HEADERS)"


    - name: Restore SDL3 cache
      uses: actions/cache/restore@v4
      with:
        path: sdl3-install
        key: sdl3-ubuntu22-${{ env.SDL3_VERSION }}

    - name: Export SDL3 paths
      run: |
        SDL3_PREFIX=$GITHUB_WORKSPACE/sdl3-install
        echo "SDL3_PREFIX=$SDL3_PREFIX" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$SDL3_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$SDL3_PREFIX/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Restore MAME cache (AVX2)
      id: cache-mame
      uses: actions/cache/restore@v4
      with:
        path: mame
        key: mame-0288-pic-AVX2-${{ hashFiles('Mame_Patches/**') }}

    - name: Clone MAME v0.288 (only if not cached)
      if: steps.cache-mame.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch mame0288 \
          https://github.com/mamedev/mame.git mame

    - name: Clone JUCE 8.0.15
      run: |
        git clone --depth 1 --branch 8.0.15 \
          https://github.com/juce-framework/JUCE.git juce

    - name: Apply MAME patches (always — make detects changed files via timestamp)
      run: |
        # Only overwrite when the content actually differs, so that on a cache
        # hit make has nothing to rebuild.
        copy_if_changed() {
          if [ ! -f "$2" ] || ! cmp -s "$1" "$2"; then
            cp "$1" "$2"
            echo "  updated: $2"
          fi
        }
        copy_if_changed Mame_Patches/esqpanel.h mame/src/mame/ensoniq/esqpanel.h
        copy_if_changed Mame_Patches/esqpanel.cpp mame/src/mame/ensoniq/esqpanel.cpp
        copy_if_changed Mame_Patches/esq5505.cpp mame/src/mame/ensoniq/esq5505.cpp
        copy_if_changed Mame_Patches/sd132.lay mame/src/mame/layout/sd132.lay
        copy_if_changed Mame_Patches/esq16_dsk.cpp mame/src/lib/formats/esq16_dsk.cpp
        copy_if_changed Mame_Patches/es5510.cpp mame/src/devices/cpu/es5510/es5510.cpp
        copy_if_changed Mame_Patches/main.h mame/src/emu/main.h
        copy_if_changed Mame_Patches/emufwd.h mame/src/emu/emufwd.h
        copy_if_changed Mame_Patches/machine.h mame/src/emu/machine.h
        copy_if_changed Mame_Patches/video.cpp mame/src/emu/video.cpp
        copy_if_changed Mame_Patches/emu.h mame/src/emu/emu.h
        copy_if_changed Mame_Patches/sound.cpp mame/src/emu/sound.cpp
        copy_if_changed Mame_Patches/machine.cpp mame/src/emu/machine.cpp
        copy_if_changed Mame_Patches/rendlay.cpp mame/src/emu/rendlay.cpp
        copy_if_changed Mame_Patches/debugcpu.cpp mame/src/emu/debug/debugcpu.cpp
        copy_if_changed Mame_Patches/cheat.cpp mame/src/frontend/mame/cheat.cpp
        copy_if_changed Mame_Patches/clifront.cpp mame/src/frontend/mame/clifront.cpp
        copy_if_changed Mame_Patches/luaengine.cpp mame/src/frontend/mame/luaengine.cpp
        copy_if_changed Mame_Patches/luaengine.h mame/src/frontend/mame/luaengine.h
        copy_if_changed Mame_Patches/luaengine_render.cpp mame/src/frontend/mame/luaengine_render.cpp
        copy_if_changed Mame_Patches/mame.cpp mame/src/frontend/mame/mame.cpp
        copy_if_changed Mame_Patches/mame.h mame/src/frontend/mame/mame.h
        copy_if_changed Mame_Patches/ui.cpp mame/src/frontend/mame/ui/ui.cpp
        copy_if_changed Mame_Patches/pluginopt.cpp mame/src/frontend/mame/ui/pluginopt.cpp
        copy_if_changed Mame_Patches/selgame.cpp mame/src/frontend/mame/ui/selgame.cpp
        copy_if_changed Mame_Patches/mainmenu.cpp mame/src/frontend/mame/ui/mainmenu.cpp
        copy_if_changed Mame_Patches/utils.cpp mame/src/frontend/mame/ui/utils.cpp
        copy_if_changed Mame_Patches/datmenu.cpp mame/src/frontend/mame/ui/datmenu.cpp
        copy_if_changed Mame_Patches/devopt.cpp mame/src/frontend/mame/ui/devopt.cpp
        copy_if_changed Mame_Patches/viewgfx.cpp mame/src/frontend/mame/ui/viewgfx.cpp
        copy_if_changed Mame_Patches/cheatopt.cpp mame/src/frontend/mame/ui/cheatopt.cpp
        copy_if_changed Mame_Patches/selmenu.cpp mame/src/frontend/mame/ui/selmenu.cpp
        copy_if_changed Mame_Patches/selsoft.cpp mame/src/frontend/mame/ui/selsoft.cpp
        copy_if_changed Mame_Patches/miscmenu.cpp mame/src/frontend/mame/ui/miscmenu.cpp
        copy_if_changed Mame_Patches/info.cpp mame/src/frontend/mame/ui/info.cpp
        copy_if_changed Mame_Patches/simpleselgame.cpp mame/src/frontend/mame/ui/simpleselgame.cpp
        copy_if_changed Mame_Patches/main.cpp mame/src/zexall/main.cpp

    - name: Compile MAME sd132 (AVX2) — incremental, picks up changed files
      run: |
        cd mame
        # MAME quirk (scripts/src/osd/sdl_cfg.lua): on Linux it ALWAYS adds
        #   -I$(shell qmake6 -query QT_INSTALL_HEADERS)
        # to every SDL OSD project, regardless of USE_QTDEBUG. That $(shell ...)
