        # valid path instead of an empty one (see that step for the reason).
        rm -rf build/projects
        make SUBTARGET=sd132 SOURCES=src/mame/ensoniq/esq5505.cpp \
             OSD=sdl3 USE_QTDEBUG=0 REGENIE=1 NO_USE_BGFX=1 \
             ARCHOPTS=-fPIC OPT_FLAGS="-mavx2" -j$(nproc)

    - name: Save MAME cache (AVX2)
      if: steps.cache-mame.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: mame
        key: mame-0288-pic-AVX2-${{ hashFiles('Mame_Patches/**') }}

    - name: Build Projucer
      run: |
        cd juce/extras/Projucer/Builds/LinuxMakefile
        make CONFIG=Release -j$(nproc)

    - name: Patch .jucer for CI
      run: |
        sed -i 's/useGlobalPath="1"/useGlobalPath="0"/g' EnsoniqSD1-LINUX.jucer
        sed -i 's|<MODULEPATH id="\([^"]*\)" path="[^"]*"/>|<MODULEPATH id="\1" path="juce/modules"/>|g' EnsoniqSD1-LINUX.jucer
        sed -i 's/pluginFormats="[^"]*"/pluginFormats="buildVST3"/' EnsoniqSD1-LINUX.jucer
        sed -i 's/sd1disk"/sd1disk\&#10;GL\&#10;asound\&#10;pulse\&#10;SDL3_ttf\&#10;ocore_sdl3"/' EnsoniqSD1-LINUX.jucer

    - name: Regenerate JuceLibraryCode via Projucer
      run: |
        # Remove the committed exporter Makefile first: Projucer does not always
        # rewrite it, and the stale copy still links the MAME 0.287-era
        # "-lsoftfloat" library, which no longer exists in 0.288 (only softfloat3).
        rm -f Builds/LinuxMakefile/Makefile
        juce/extras/Projucer/Builds/LinuxMakefile/build/Projucer \
          --resave EnsoniqSD1-LINUX.jucer
        ls -l JuceLibraryCode/
        # Belt and braces: if anything still emits the obsolete -lsoftfloat, strip
        # it here. The trailing space keeps -lsoftfloat3 intact.
        sed -i 's/-lsoftfloat //g' Builds/LinuxMakefile/Makefile
        echo "--- link libs after fixup ---"
        grep -o -- "-lsoftfloat[0-9]*" Builds/LinuxMakefile/Makefile | sort -u

    - name: Compile JUCE VST3 (AVX2)
      run: |
        cd Builds/LinuxMakefile
        export CXXFLAGS="-mavx2 -I${{ env.SDL3_PREFIX }}/include"
        export LDFLAGS="-L${{ env.SDL3_PREFIX }}/lib -Wl,-rpath,${{ env.SDL3_PREFIX }}/lib -lz -lX11 -lXext"
        make CONFIG=Release -j$(nproc)

    - name: Inject Lua and SDL3 into VST3 Bundle (AVX2)
      run: |
        # Put Resources folder into VST3 bundle
        mkdir -p Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/Resources
        cp -R mame/plugins Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/Resources/
        
        # copy SDL3 and SDL3_ttf into VST3
        cp -P ${{ env.SDL3_PREFIX }}/lib/libSDL3*.so* Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/x86_64-linux/
        
        # RPATH (Run-time search path) rewrite with patchelf
        patchelf --set-rpath '$ORIGIN' Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/x86_64-linux/EnsoniqSD1.so
        
        # Check
        ls -la Builds/LinuxMakefile/build/EnsoniqSD1.vst3/Contents/x86_64-linux/

    - name: Upload VST3 artifact (AVX2)
      uses: actions/upload-artifact@v4
      with:
        name: Ensoniq_SD1_Linux_VST3_AVX2
        path: Builds/LinuxMakefile/build/*.vst3